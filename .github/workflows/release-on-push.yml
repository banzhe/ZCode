name: Build and Release

on:
  push:
    branches:
      - my_dev

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # 必须先安装 pnpm，setup-node 的 cache: pnpm 才能定位 store 路径。
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.33.2

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24.14.0"
          cache: pnpm

      - name: Stamp version and resolve tag
        id: meta
        shell: pwsh
        run: |
          # 仅修改 runner 工作区的 package.json，不回写仓库。
          # 时间戳放在 -build. 预发布段，保证同一基础版本内按 UTC 时间排序。
          # 注意：Desktop 的 isVersionGreaterThan 用 semver.coerce 丢弃预发布段，
          # 同一基础版本（如 3.16.2）的多次构建会被判为相等、不触发更新；
          # 要让每次发布都被识别为更新，必须递增 major/minor/patch。
          $pkgPath = 'package.json'
          $text = Get-Content -LiteralPath $pkgPath -Raw
          $pattern = '(?m)^(\s*"version":\s*")([^"]+)(")'
          $match = [regex]::Match($text, $pattern)
          if (-not $match.Success) { throw 'version field not found in package.json' }
          $base = $match.Groups[2].Value -replace '-.*$', ''
          $stamp = (Get-Date).ToUniversalTime().ToString('yyyyMMddHHmmss')
          $version = "$base-build.$stamp"
          $updated = [regex]::Replace($text, $pattern, ('${1}' + $version + '${3}'), 1)
          Set-Content -LiteralPath $pkgPath -Value $updated -NoNewline -Encoding utf8
          $tag = "v$version"
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT
          Write-Host "Stamped version: $version"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Windows desktop installer
        env:
          ZCODE_TARGET_OS: win
          ZCODE_TARGET_ARCH: x64
          # 显式设为空字符串：build-time-config 对空串视为关闭，优先级高于私有默认配置，
          # 保证 CI 产物不检查、不下载 ZCode 自身的自动更新。
          ZCODE_AUTO_UPDATE: ""
        run: pnpm bundle:desktop -- --os win --arch x64

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ZCode ${{ steps.meta.outputs.version }} (${{ steps.meta.outputs.tag }})
          target_commitish: ${{ github.sha }}
          files: |
            packages/desktop/dist/*.exe
            packages/desktop/dist/*.blockmap
            packages/desktop/dist/latest*.yml
          fail_on_unmatched_files: true
          generate_release_notes: true
          draft: false
          prerelease: true
